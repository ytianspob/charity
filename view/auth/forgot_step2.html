<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>找回密码 - 第二步</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-lg shadow p-6">
        <?php
        $authMsg    = \think\facade\Session::get('auth_msg');
        $authStatus = \think\facade\Session::get('auth_status'); // success / error
        ?>
        <?php if (!empty($authMsg)): ?>
            <div style="
                margin-bottom:0.75rem;
                padding:0.6rem 0.9rem;
                border-radius:0.5rem;
                font-size:0.9rem;
                <?php if ($authStatus === 'success'): ?>
                    background:#ecfdf3;color:#166534;border:1px solid #bbf7d0;
                <?php else: ?>
                    background:#fef2f2;color:#991b1b;border:1px solid #fecaca;
                <?php endif; ?>
            ">
                <?php echo htmlspecialchars($authMsg); ?>
            </div>
        <?php endif; ?>

        <h1 class="text-xl font-semibold mb-2 text-center">找回密码</h1>
        <p class="text-xs text-gray-500 mb-4 text-center">
            第二步：请回答你的密保问题，并设置新密码。
        </p>

        <div class="mb-4 text-sm text-gray-700">
            <div class="mb-1">
                用户名：<span class="font-medium"><?php echo htmlspecialchars($username); ?></span>
            </div>
            <div>
                密保问题：<span class="font-medium"><?php echo htmlspecialchars($security_question); ?></span>
            </div>
        </div>

        <form method="post" action="/forgot/reset" class="space-y-4">
            <input type="hidden" name="user_id" value="<?php echo (int)$user_id; ?>">

            <div>
                <label class="block text-sm text-gray-700 mb-1">密保答案</label>
                <input type="text" name="security_answer"
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b5b95]"
                       required>
            </div>

            <div>
                <label class="block text-sm text-gray-700 mb-1">新密码</label>
                <input type="password" name="new_password"
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b5b95]"
                       required>
            </div>

            <div>
                <label class="block text-sm text-gray-700 mb-1">确认新密码</label>
                <input type="password" name="confirm_password"
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b5b95]"
                       required>
            </div>

            <div class="flex items-center justify-between mt-2">
                <a href="/forgot/step1" class="text-xs text-gray-500 hover:text-gray-700">返回上一步</a>
                <button type="submit"
                        class="px-4 py-2 rounded bg-[#6b5b95] text-sm text-white hover:bg-[#5a4a7f]">
                    重置密码
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
