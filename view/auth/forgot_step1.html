<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>找回密码 - 第一步</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-lg shadow p-6">
        <?php
        $authMsg    = \think\facade\Session::get('auth_msg');
        $authStatus = \think\facade\Session::get('auth_status'); // success / error
        ?>
        <?php if (!empty($authMsg)): ?>
            <div style="
                margin-bottom:0.75rem;
                padding:0.6rem 0.9rem;
                border-radius:0.5rem;
                font-size:0.9rem;
                <?php if ($authStatus === 'success'): ?>
                    background:#ecfdf3;color:#166534;border:1px solid #bbf7d0;
                <?php else: ?>
                    background:#fef2f2;color:#991b1b;border:1px solid #fecaca;
                <?php endif; ?>
            ">
                <?php echo htmlspecialchars($authMsg); ?>
            </div>
        <?php endif; ?>

        <h1 class="text-xl font-semibold mb-4 text-center">找回密码</h1>
        <p class="text-xs text-gray-500 mb-4 text-center">
            第一步：请输入你的登录用户名。
        </p>

        <form method="post" action="/forgot/checkUser" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-700 mb-1">用户名</label>
                <input type="text" name="username"
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b5b95]"
                       placeholder="请输入登录用户名" required>
            </div>
            <div class="flex items-center justify-between mt-2">
                <a href="/user/login" class="text-xs text-gray-500 hover:text-gray-700">返回登录</a>
                <button type="submit"
                        class="px-4 py-2 rounded bg-[#6b5b95] text-sm text-white hover:bg-[#5a4a7f]">
                    下一步
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
