<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发送站内信 - 国开社区公益</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="min-h-screen max-w-xl mx-auto p-4 sm:p-6">
    <header class="mb-4 flex items-center justify-between">
        <h1 class="text-lg font-semibold text-gray-800">发送站内信</h1>
        <a href="/message/index" class="text-sm text-indigo-600 hover:text-indigo-800">返回</a>
    </header>

    <form method="post" action="/message/send" class="bg-white rounded-lg shadow p-4 sm:p-6 space-y-4">
        <div>
            <label class="block text-sm text-gray-700 mb-1">收件人昵称</label>
            <input type="text" name="to_nickname"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="输入对方在本站的昵称" required>
            <p class="mt-1 text-xs text-gray-500">请与对方在资料中设置的昵称保持一致。</p>
        </div>

        <div>
            <label class="block text-sm text-gray-700 mb-1">标题（可选）</label>
            <input type="text" name="title"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="简要说明这条消息的主题">
        </div>

        <div>
            <label class="block text-sm text-gray-700 mb-1">内容</label>
            <textarea name="content" rows="6"
                      class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      placeholder="请输入要发送的消息内容" required></textarea>
        </div>

        <div class="flex justify-end">
            <button type="submit"
                    class="px-4 py-2 rounded bg-[#6b5b95] text-sm text-white hover:bg-[#5a4a7f]">
                发送
            </button>
        </div>
    </form>
</div>
</body>
</html>
