<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国开社区公益-用户登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(to bottom right, #f9fafb, #e5e7eb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 36rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                        0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2rem;
        }

        .title {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #374151;
        }

        .form-section {
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            color: #374151;
        }

        .form-group { margin-bottom: 1.5rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4b5563;
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #9333ea;
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button:hover { background: #7e22ce; }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            color: #4b5563;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #9333ea;
            text-decoration: none;
            margin-left: 0.25rem;
        }

        .footer-links a:hover { color: #7e22ce; }

        .copyright {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .error { border-color: #ef4444; }

        .error-message {
            margin-top: 0.5rem;
            color: #ef4444;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <?php
        $authMsg    = \think\facade\Session::get('auth_msg');
        $authStatus = \think\facade\Session::get('auth_status'); // success / error
        ?>
        <?php if (!empty($authMsg)): ?>
            <div style="
                margin-bottom:0.75rem;
                padding:0.6rem 0.9rem;
                border-radius:0.5rem;
                font-size:0.9rem;
                <?php if ($authStatus === 'success'): ?>
                    background:#ecfdf3;color:#166534;border:1px solid #bbf7d0;
                <?php else: ?>
                    background:#fef2f2;color:#991b1b;border:1px solid #fecaca;
                <?php endif; ?>
            ">
                <?php echo htmlspecialchars($authMsg); ?>
            </div>
        <?php endif; ?>

        <h1 class="title">国开社区公益-用户登录</h1>

        <!-- method 和 action 提交到 /user/login -->
        <form id="loginForm" method="post" action="/user/login">
            <div class="form-section">
                <span>登录</span>
            </div>

            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">登录</button>

            <div id="errorBox" class="error-message" style="display:none;"></div>
        </form>

        <div class="footer-links">
            <span>没有账户？</span>
            <a href="/user/register" id="registerLink">点击注册</a><br><br>
            <a href="/forgot/step1" class="text-xs text-gray-500 hover:text-gray-700">忘记密码</a>
        </div>

        <div class="copyright">
            Copyright © 国开社区公益
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            document.querySelectorAll('input').forEach(input => {
                input.classList.remove('error');
            });
            errorBox.style.display = 'none';
            errorBox.textContent = '';

            if (!username || !password) {
                errorBox.textContent = '请填写用户名和密码';
                errorBox.style.display = 'block';
                if (!username) document.getElementById('username').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }

            form.submit();
        });
    </script>
</body>
</html>
