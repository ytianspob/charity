<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国开社区公益-用户注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(to bottom right, #f9fafb, #e5e7eb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 36rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                        0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2rem;
        }

        .title {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #374151;
        }

        .form-section {
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            color: #374151;
        }

        .form-group { margin-bottom: 1.5rem; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4b5563;
            font-size: 0.875rem;
        }

        input, select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #9333ea;
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button:hover { background: #7e22ce; }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            color: #4b5563;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #9333ea;
            text-decoration: none;
            margin-left: 0.25rem;
        }

        .footer-links a:hover { color: #7e22ce; }

        .copyright {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .error { border-color: #ef4444; }

        .error-message {
            margin-top: 0.5rem;
            color: #ef4444;
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <?php
        $authMsg    = \think\facade\Session::get('auth_msg');
        $authStatus = \think\facade\Session::get('auth_status'); // success / error
        ?>
        <?php if (!empty($authMsg)): ?>
            <div style="
                margin-bottom:0.75rem;
                padding:0.6rem 0.9rem;
                border-radius:0.5rem;
                font-size:0.9rem;
                <?php if ($authStatus === 'success'): ?>
                    background:#ecfdf3;color:#166534;border:1px solid #bbf7d0;
                <?php else: ?>
                    background:#fef2f2;color:#991b1b;border:1px solid #fecaca;
                <?php endif; ?>
            ">
                <?php echo htmlspecialchars($authMsg); ?>
            </div>
        <?php endif; ?>

        <h1 class="title">国开社区公益-用户注册</h1>

        <!-- 提交到 /user/register -->
        <form id="registrationForm" method="post" action="/user/register">
            <div class="form-section">
                <span>注册</span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="fullName">真实姓名/组织名</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="password_confirm" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </div>

            <!-- 隐藏字段，将 fullName 映射到 nickname，提交给后端 -->
            <input type="hidden" id="nickname" name="nickname">

            <button type="submit">注册</button>

            <div id="errorBox" class="error-message" style="display:none;"></div>
        </form>

        <div class="footer-links">
            <span>已有账户？</span>
            <a href="/user/login" id="loginLink">点击登录</a>
        </div>

        <div class="copyright">
            Copyright © 国开社区公益
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const username         = document.getElementById('username').value.trim();
            const fullName         = document.getElementById('fullName').value.trim();
            const password         = document.getElementById('password').value;
            const confirmPassword  = document.getElementById('confirmPassword').value;
            const email            = document.getElementById('email').value.trim();
            const phone            = document.getElementById('phone').value.trim();

            document.querySelectorAll('input').forEach(input => {
                input.classList.remove('error');
            });
            errorBox.style.display = 'none';
            errorBox.textContent = '';

            if (!username || !fullName || !password || !confirmPassword || !email || !phone) {
                errorBox.textContent = '请填写所有必填项';
                errorBox.style.display = 'block';
                if (!username) document.getElementById('username').classList.add('error');
                if (!fullName) document.getElementById('fullName').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                if (!confirmPassword) document.getElementById('confirmPassword').classList.add('error');
                if (!email) document.getElementById('email').classList.add('error');
                if (!phone) document.getElementById('phone').classList.add('error');
                return;
            }

            if (password !== confirmPassword) {
                errorBox.textContent = '两次密码输入不一致';
                errorBox.style.display = 'block';
                document.getElementById('password').classList.add('error');
                document.getElementById('confirmPassword').classList.add('error');
                return;
            }

            if (email) {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    errorBox.textContent = '请输入有效的邮箱地址';
                    errorBox.style.display = 'block';
                    document.getElementById('email').classList.add('error');
                    return;
                }
            }

            // 将 fullName 传给后端的 nickname 字段
            document.getElementById('nickname').value = fullName;

            form.submit();
        });
    </script>
</body>
</html>
