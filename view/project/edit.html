<script>
    // 封面上传
    const coverInput   = document.getElementById('cover-input');
    const coverFile    = document.getElementById('cover-file');
    const coverPreview = document.getElementById('cover-preview');

    if (coverInput && coverPreview) {
        coverInput.addEventListener('input', function () {
            const url = this.value.trim();
            coverPreview.src = url || 'https://via.placeholder.com/800x400?text=%E6%97%A0%E5%B0%81%E9%9D%A2%E5%9B%BE';
        });
    }

    if (coverFile) {
        coverFile.addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('cover', file);

            fetch('/project/uploadCover', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.code === 1) {
                        coverInput.value = data.url;
                        coverPreview.src = data.url;
                    } else {
                        alert(data.msg || '上传失败');
                    }
                })
                .catch(() => {
                    alert('上传失败，请稍后再试');
                });
        });
    }

    // 收款二维码上传
    const qrcodeInput   = document.getElementById('qrcode-image-input');
    const qrcodeFile    = document.getElementById('qrcode-image-file');
    const qrcodePreview = document.getElementById('qrcode-image-preview');
    const qrcodeWrap    = qrcodePreview ? qrcodePreview.parentElement : null;

    if (qrcodeInput && qrcodePreview) {
        qrcodeInput.addEventListener('input', function () {
            const url = this.value.trim();
            if (url) {
                qrcodePreview.src = url;
                if (qrcodeWrap) qrcodeWrap.style.display = 'block';
            } else {
                if (qrcodeWrap) qrcodeWrap.style.display = 'none';
            }
        });
    }

    if (qrcodeFile) {
        qrcodeFile.addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('qrcode', file);

            fetch('/project/uploadQrcode', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.code === 1) {
                        qrcodeInput.value = data.url;
                        qrcodePreview.src = data.url;
                        if (qrcodeWrap) qrcodeWrap.style.display = 'block';
                    } else {
                        alert(data.msg || '上传失败');
                    }
                })
                .catch(() => {
                    alert('上传失败，请稍后再试');
                });
        });
    }

    // wangEditor v4 初始化
    const E = window.wangEditor;
    const editor = new E('#editor-toolbar', '#editor');

    // 上传图片到服务器
    editor.config.uploadImgServer = '/project/uploadContentImage';
    editor.config.uploadFileName = 'wangeditor-uploaded-image';
    editor.config.uploadImgMaxSize = 5 * 1024 * 1024;
    editor.config.uploadImgMaxLength = 10;
    editor.config.uploadImgAccept = ['jpg', 'jpeg', 'png', 'gif'];

    editor.config.menus = [
        'head',
        'bold',
        'italic',
        'underline',
        'list',
        'justify',
        'image',
        'link',
        'undo',
        'redo'
    ];

    const contentInput = document.getElementById('content-input');
    editor.config.onchange = function (html) {
        contentInput.value = html;
    };

    editor.create();

    if (contentInput.value) {
        editor.txt.html(contentInput.value);
    }
</script>
